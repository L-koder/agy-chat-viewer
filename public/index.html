<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGY Chat Viewer — Antigravity CLI History</title>
  <meta name="description" content="Visual chat history viewer for Google Antigravity CLI sessions">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="url(#grad1)" opacity="0.9"/>
              <path d="M2 17L12 22L22 17" stroke="url(#grad2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M2 12L12 17L22 12" stroke="url(#grad2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <defs>
                <linearGradient id="grad1" x1="2" y1="2" x2="22" y2="12">
                  <stop stop-color="#818cf8"/>
                  <stop offset="1" stop-color="#c084fc"/>
                </linearGradient>
                <linearGradient id="grad2" x1="2" y1="12" x2="22" y2="22">
                  <stop stop-color="#818cf8"/>
                  <stop offset="1" stop-color="#c084fc"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
          <div>
            <h1 class="logo-title">AGY Viewer</h1>
            <p class="logo-subtitle" id="chatCount">Loading...</p>
          </div>
        </div>
      </div>

      <!-- Stats Bar -->
      <div class="stats-bar" id="statsBar">
        <div class="stat-item">
          <span class="stat-value" id="statTotal">--</span>
          <span class="stat-label">Chats</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="statMessages">--</span>
          <span class="stat-label">Messages</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="statModels">--</span>
          <span class="stat-label">Models</span>
        </div>
      </div>

      <!-- Search & Filter -->
      <div class="sidebar-controls">
        <div class="search-box">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <path d="M21 21L16.65 16.65"/>
          </svg>
          <input type="text" id="searchInput" placeholder="Search chats..." autocomplete="off">
        </div>
        <div class="filter-row">
          <select id="modelFilter" class="filter-select">
            <option value="">All Models</option>
          </select>
          <select id="sortFilter" class="filter-select">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
            <option value="most-messages">Most Messages</option>
          </select>
          <button id="galleryBtn" class="filter-select" title="Image Gallery" style="padding: 6px 10px; cursor: pointer;">🖼️</button>
        </div>
      </div>

      <!-- Image Gallery Modal -->
      <div id="galleryModal" class="modal-overlay hidden">
        <div class="modal-content gallery-modal">
          <div class="modal-header">
            <h2>Media Gallery</h2>
            <button class="close-btn" id="closeGalleryBtn">✕</button>
          </div>
          <div class="gallery-grid" id="galleryGrid"></div>
        </div>
      </div>

      <!-- Lightbox Modal -->
      <div id="lightboxModal" class="modal-overlay hidden" style="z-index: 2000; padding: 20px;">
        <div style="position: relative; max-width: 100%; max-height: 100%; display: flex; align-items: center; justify-content: center;">
          <img id="lightboxImg" src="" style="max-width: 100%; max-height: 90vh; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.5);">
        </div>
      </div>

      <!-- Chat List -->
      <div class="chat-list" id="chatList">
        <div class="loading-spinner">
          <div class="spinner"></div>
          <p>Loading conversations...</p>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main id="mainContent" class="main-content">
      <!-- Empty State -->
      <div id="emptyState" class="empty-state">
        <div class="empty-icon">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <h2>Select a conversation</h2>
        <p>Choose a chat from the sidebar to view its full history</p>
      </div>

      <!-- Chat View -->
      <div id="chatView" class="chat-view hidden">
        <!-- Chat Header -->
        <div class="chat-header">
          <div class="chat-header-info">
            <button id="backBtn" class="back-btn" title="Back to list">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
              </svg>
            </button>
            <div>
              <div style="display:flex; align-items:center; gap:8px;">
                <h2 id="chatTitle" class="chat-title">Chat Title</h2>
                <button id="renameChatBtn" class="rename-btn" title="Rename Chat">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                </button>
              </div>
              <div class="chat-meta-row">
                <span class="chat-meta-badge model-badge" id="chatModel">Model</span>
                <span class="chat-meta-text" id="chatDate">Date</span>
                <span class="chat-meta-text" id="chatStats">Stats</span>
              </div>
              <div class="chat-meta-row workspace-row" id="workspaceRow" style="display:none">
                <svg class="workspace-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                </svg>
                <span class="workspace-path" id="chatWorkspace">~</span>
                <button class="workspace-cd-btn" id="copyWorkspaceBtn" title="Copy cd command">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="4 17 10 11 4 5"/>
                    <line x1="12" y1="19" x2="20" y2="19"/>
                  </svg>
                  cd
                </button>
              </div>
            </div>
          </div>
          <div class="chat-header-actions">
            <div class="search-box" style="margin-right: 15px; width: 250px; display: flex; align-items: center; position: relative;">
              <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="position: absolute; left: 10px;">
                <circle cx="11" cy="11" r="8"/>
                <path d="M21 21L16.65 16.65"/>
              </svg>
              <input type="text" id="inChatSearchInput" placeholder="Search in chat..." autocomplete="off" style="font-size: 13px; padding-left: 32px; padding-right: 80px; padding-top: 6px; padding-bottom: 6px; width: 100%;">
              <div id="inChatSearchControls" style="position: absolute; right: 8px; display: none; align-items: center; gap: 4px; font-size: 11px; color: var(--text-tertiary);">
                <span id="inChatSearchCount">0/0</span>
                <button id="inChatSearchPrev" class="action-btn" style="padding: 2px;" title="Previous match"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 15l-6-6-6 6"/></svg></button>
                <button id="inChatSearchNext" class="action-btn" style="padding: 2px;" title="Next match"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
              </div>
            </div>
            <button id="chatGalleryBtn" class="action-btn" title="View media in this chat" style="margin-right: 15px;">
              🖼️
            </button>
            <label class="toggle-label">
              <input type="checkbox" id="toggleFull" class="toggle-input">
              <span class="toggle-slider"></span>
              <span class="toggle-text">Full Transcript</span>
            </label>
            <button id="copyCommandBtn" class="action-btn" title="Copy agy CLI command to resume this chat">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
            </button>
            <button id="toggleThinking" class="action-btn" title="Toggle thinking blocks">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                <line x1="12" y1="17" x2="12.01" y2="17"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Messages Container -->
        <div class="messages-container" id="messagesContainer">
          <div class="loading-spinner" id="messagesLoading">
            <div class="spinner"></div>
            <p>Loading messages...</p>
          </div>
          <div id="messagesList" class="messages-list"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
